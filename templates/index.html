<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShare – Self-Destructing Secrets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #1e1e2f;
            max-width: 560px;
            width: 100%;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .card-header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-header p {
            color: #a0a0b8;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #c8c8e0;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .form-group textarea, .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a40;
            border: 2px solid #3a3a55;
            border-radius: 12px;
            color: #f0f0ff;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }
        .form-group textarea:focus, .form-group input:focus, .form-group select:focus {
            border-color: #f7971e;
        }
        .form-group textarea { min-height: 110px; resize: vertical; }
        .form-group input[type="file"] {
            padding: 10px;
            background: #2a2a40;
            color: #a0a0b8;
        }
        .form-group small {
            color: #6a6a88;
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 6px;
        }
        .btn:hover { transform: scale(1.01); box-shadow: 0 8px 28px rgba(247,151,30,0.35); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .result-box {
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 14px;
            background: #1a3a2a;
            border-left: 5px solid #2ecc71;
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .result-box.show { display: block; }
        .result-box .link-wrapper {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .result-box .link-wrapper input {
            flex: 1;
            padding: 10px 14px;
            background: #0f1f18;
            border: 1px solid #2a5a3f;
            border-radius: 10px;
            color: #b0e0c0;
            font-size: 14px;
            outline: none;
            min-width: 150px;
        }
        .result-box .link-wrapper button {
            padding: 10px 18px;
            background: #2ecc71;
            border: none;
            border-radius: 10px;
            color: #0f1f18;
            font-weight: 700;
            cursor: pointer;
        }
        .result-box .details {
            color: #7ddfa0;
            font-size: 13px;
            margin-top: 10px;
            opacity: 0.8;
        }
        .spinner { display: none; text-align: center; margin-top: 18px; color: #a0a0b8; }
        .spinner.show { display: block; }
        .spinner .dot {
            display: inline-block; width: 12px; height: 12px;
            background: #f7971e; border-radius: 50%; margin: 0 4px;
            animation: bounce 1.4s infinite both;
        }
        .spinner .dot:nth-child(1) { animation-delay: -0.32s; }
        .spinner .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .form-row { grid-template-columns: 1fr; }
        }
        .file-info {
            color: #7ddfa0;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .file-info.show { display: block; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <h1>🔐 SecureShare</h1>
        <p>Your secret self-destructs after reading</p>
    </div>

    <form id="createForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="text">Your Secret (Text)</label>
            <textarea id="text" placeholder="Enter your secret text here..." rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="file">Or Upload a File</label>
            <input type="file" id="file" class="form-control">
            <small>Supported: Images, PDFs, Documents, ZIP files (Max 50MB)</small>
            <div class="file-info" id="fileInfo">📎 File selected: <span id="fileName"></span></div>
        </div>

        <div class="form-group">
            <label for="password">Optional Password (extra security)</label>
            <input type="password" id="password" placeholder="Leave blank for no password">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="views">Self-Destruct After</label>
                <select id="views">
                    <option value="1">1 View</option>
                    <option value="3" selected>3 Views</option>
                    <option value="5">5 Views</option>
                    <option value="10">10 Views</option>
                </select>
            </div>
            <div class="form-group">
                <label for="expiry">Expires</label>
                <select id="expiry">
                    <option value="never">Never</option>
                    <option value="1">1 Hour</option>
                    <option value="6">6 Hours</option>
                    <option value="24" selected>24 Hours</option>
                    <option value="72">3 Days</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn" id="createBtn">🔒 Generate Secure Link</button>

        <div class="spinner" id="spinner">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span style="display:block; margin-top:8px;">Encrypting &amp; saving securely…</span>
        </div>
    </form>

    <div class="result-box" id="resultBox">
        <div style="font-weight: 600; color: #7ddfa0;">✅ Secret Created!</div>
        <div class="link-wrapper">
            <input type="text" id="linkOutput" readonly>
            <button id="copyBtn">📋 Copy</button>
        </div>
        <div class="details" id="detailsOutput"></div>
    </div>
</div>

<script>
    const form = document.getElementById('createForm');
    const createBtn = document.getElementById('createBtn');
    const spinner = document.getElementById('spinner');
    const resultBox = document.getElementById('resultBox');
    const linkOutput = document.getElementById('linkOutput');
    const detailsOutput = document.getElementById('detailsOutput');
    const fileInput = document.getElementById('file');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');

    // Show file name when selected
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            fileName.textContent = this.files[0].name;
            fileInfo.classList.add('show');
        } else {
            fileInfo.classList.remove('show');
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const text = document.getElementById('text').value.trim();
        const file = fileInput.files[0];

        if (!text && !file) {
            alert('Please enter text or select a file.');
            return;
        }

        const formData = new FormData();
        if (text) {
            formData.append('text', text);
        }
        if (file) {
            formData.append('file', file);
        }
        formData.append('password', document.getElementById('password').value);
        formData.append('views', document.getElementById('views').value);
        formData.append('expiry', document.getElementById('expiry').value);

        createBtn.disabled = true;
        spinner.classList.add('show');
        resultBox.classList.remove('show');

        try {
            const res = await fetch('/create', { method: 'POST', body: formData });
            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'Failed to create');

            linkOutput.value = data.link;
            let typeText = data.is_file ? '📁 File: ' + data.filename : '📝 Text';
            detailsOutput.textContent = `🔹 ${data.views} view(s) left · 🔹 Expires: ${data.expires} · 🔹 ${typeText}`;
            resultBox.classList.add('show');
            linkOutput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (err) {
            alert('Error: ' + err.message);
        }

        createBtn.disabled = false;
        spinner.classList.remove('show');
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        linkOutput.select();
        navigator.clipboard?.writeText(linkOutput.value);
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = '📋 Copy', 2000);
    });
</script>
</body>
</html>
