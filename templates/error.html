<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error – SecureShare</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #141414, #2c2c3a); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #eef2ff; }
        .card { background: rgba(18, 22, 44, 0.95); border-radius: 24px; padding: 40px 32px; max-width: 520px; width: 100%; box-shadow: 0 28px 80px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
        .theme-toggle { border: none; border-radius: 999px; padding: 10px 14px; background: rgba(255,255,255,0.1); color: #f0f0ff; cursor: pointer; font-weight: 700; }
        body[data-theme='light'] { background: #f3f4fb; color: #111827; }
        body[data-theme='light'] .card { background: #ffffff; border-color: rgba(15,23,42,0.08); }
        body[data-theme='light'] .card h2 { color: #111827; }
        body[data-theme='light'] .btn { color: #121827; }
        .card h1 { font-size: 64px; margin-bottom: 12px; }
        .card h2 { font-size: 28px; margin-bottom: 16px; color: #f7d47a; }
        .card p { color: #b3b8d1; line-height: 1.7; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 28px; border-radius: 14px; background: linear-gradient(135deg, #7d60ff, #4ab8ff); color: #121827; text-decoration: none; font-weight: 700; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 18px 36px rgba(74, 184, 255, 0.28); }
    </style>
</head>
<body>
<div class="card">
        <div class="card-header">
            <h1>⚠️ Oops</h1>
            <button type="button" class="theme-toggle" id="themeToggle">☀️ Light</button>
        </div>
        <h2>{{ message or 'Something went wrong.' }}</h2>
        <p>SecureShare is designed to keep secrets safe. If you believe this is an error, try again from the homepage.</p>
        <a href="/" class="btn">🏠 Back to Home</a>
    </div>
    <script>
        const toggle = document.getElementById('themeToggle');
        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            toggle.textContent = theme === 'light' ? '🌙 Dark' : '☀️ Light';
            localStorage.setItem('theme', theme);
        }
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        }
        toggle.addEventListener('click', () => {
            const current = document.body.dataset.theme || 'dark';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });
        initTheme();
    </script>
</body>
</html>
